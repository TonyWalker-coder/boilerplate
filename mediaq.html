<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /*Media Queries for Responsive Design and hero loading*/
        :root {
            --mobile: 480px;
            --tablet: 768px;
            --tablet-landscape: 768px;
            --laptop: 1024px;
            --desktop: 1280px;
            --navbar-height-desktop: 60px;
            --navbar-height-mobile: 50px;
            --footer-height: 100px;
        }

        .hero {
            display: flex;

            background-image: url("assets/images/hero/hero-mobile.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
                            height:100%
           


        }

        body {
            display: flex;
            padding-top: 50px;
            margin: 0;
            background-color: red;
            padding-bottom: 50px;
            height: 594px;

        }

        /* Mobile Portrait */
        @media (max-width: 480px) {

            .container {
                display: flex;
                background-color: red;
                min-width: 100%;
                margin: 0;
                border: 0;
                padding: 0;
                width: fit-content;

                


            }

            body h1 {
                color: pink;
            }

        }

        /* Mobile Landscape */
        /* Short screens: mobile landscape, foldables, small embedded browsers */
        @media (max-height: 400px) {
            .hero {
                min-height: auto;
            }



            body {
                background-color: green;
            }



            body h1 {
                color: orangered;
            }
        }

        /* Tablet Portrait */
        @media (min-width: 768px) {

            .hero {
                background-image: url("/assets/images/hero/hero-desktop.webp");
                min-height: calc(100vh - var(--navbar-height-desktop) - var(--footer-height));
            }



            body {
                background-color: blue;
            }



            body h1 {
                color: green;
            }
        }

        /* Tablet Landscape */
        @media (min-width: 768px) and (max-height:627px) {
            body {
                background-color: yellow;
            }



            body h1 {
                color: blue;
            }
        }

        /* Laptop */
        @media (min-width:1024px) {
            body {
                background-color: white;
            }



            body h1 {
                color: yellow;
            }
        }

        /* Desktop */
        @media (min-width: 1280px) {
            body {
                background-color: black;
            }



            body h1 {
                color: white;
            }
        }

        body {
            height: 100%;
        }
    </style>
</head>

<body>
    <div class="container hero">
        <h1> hi tony</h1>
    </div>
</body>
