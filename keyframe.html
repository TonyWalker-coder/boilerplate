<style>

@keyframes shake {
    0% {
        transform: translate(0, 0) rotate(0deg);
    }

    25% {
        transform: translate(-2px, 1px) rotate(-1deg);
    }

    50% {
        transform: translate(2px, -1px) rotate(1deg);
    }

    75% {
        transform: translate(-1px, 1px) rotate(0deg);
    }

    100% {
        transform: translate(0, 0) rotate(0deg);
    }
}

/* Fade-in animation for overlays, frames, modals */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(0.98);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}
  /* Create the animation... */
  @keyframes slide-in {
    from {
      transform: translateX(-100%);
    }
    to {
      transform: translateX(0%);
    }
  }
    @keyframes drop-in {
    from {
      transform:
        rotate(-30deg) translateY(-100%);
      opacity: 0;
    }
    to {
      transform:
        rotate(0deg) translateY(0%);
      opacity: 1;
    }
  }

  .box1 {
        border:solid 5px yellow;
    height: 90px;
    width: 90px;
    background-color: blue;
    color: red;
    animation: drop-in 1000ms;
  }

  /* ...and then apply it: */
  .box {
    border:solid 5px yellow;
    height: 90px;
    width: 90px;
    background-color: blue;
    color: red;
    animation: slide-in 1000ms;
  }
    .box2 {
            border:solid 5px yellow;
    height: 90px;
    width: 90px;
    background-color: blue;
    color: red;
    animation: slide-in 1000ms;
    animation-timing-function: linear;
  }
    @keyframes slide-in2 {
    from {
      transform: translateX(-100%);
      opacity: 0.25;
    }
    to {
      transform: translateX(0%);
      opacity: 1;
    }
  }

  .box3 {
            border:solid 5px yellow;
    height: 90px;
    width: 90px;
    background-color: blue;
    color: red;
      animation: slide-in 1000ms;
    animation-iteration-count: 3;
  }
    @keyframes spin {
    from {
      transform: rotate(0turn);
    }
    to {
      transform: rotate(1turn);
    }
  }
  
  .spinner {
    animation: spin 1000ms;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

    @keyframes fancy-spin {
    0% {
      transform: rotate(0turn) scale(1);
    }
    25% {
      transform: rotate(1turn) scale(1);
    }
    50% {
      transform: rotate(1turn) scale(1.5);
    }
    75% {
      transform: rotate(0turn) scale(1.5);
    }
    100% {
      transform: rotate(0turn) scale(1);
    }
  }
  
  .spinner2 {
    animation: fancy-spin 2000ms;
    animation-iteration-count: infinite;
  }
    @keyframes spin {
    0% {
      transform: rotate(0turn);
    }
    100% {
      transform: rotate(1turn)
    }
  }
  
  @keyframes multi-step-spin {
    0% {
      transform: rotate(0turn);
    }
    25% {
      transform: rotate(0.25turn);
    }
    50% {
      transform: rotate(0.5turn);
    }
    75% {
      transform: rotate(0.75turn);
    }
    100% {
      transform: rotate(1turn);
    }
  }
  
  .spinner3 {
    animation: spin 2000ms;
    animation-iteration-count: infinite;
    width: 20px;
    height: 20px;
  }
  .multi-step-spinner {
    animation: multi-step-spin 2000ms;
    animation-iteration-count: infinite;
    width: 20px;
    height: 20px;
  }
    @keyframes grow-and-shrink {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.5);
    }
    100% {
      transform: scale(1);
    }
  }

  .box4 {
    border:solid 5px yellow;
    height: 90px;
    width: 90px;
    background-color: blue;
    color: red;
    animation: grow-and-shrink 4000ms;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
    @keyframes grow-and-shrink {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.5);
    }
  }

  .box5 {
    border:solid 5px yellow;
    height: 90px;
    width: 90px;
    background-color: blue;
    color: red;
    animation: grow-and-shrink 2000ms;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }

    @keyframes bounce {
    from {
      transform: translateY(0px);
    }
    to {
      transform: translateY(-20px);
    }
  }

  .box6 {
    border:solid 5px yellow;
    height: 90px;
    width: 90px;
    background-color: blue;
    color: red;
    border-radius: 50%;
    animation:
      bounce 300ms
      alternate infinite
      cubic-bezier(.2, .65, .6, 1);
  }
  img{
    width:30px;
    height:30px;
  }

</style>
