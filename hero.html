<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hero Test</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    margin: 0;
}

.info {
    position: fixed;
    top: 1rem;
    left: 1rem;
    background: rgba(0,0,0,.7);
    color: white;
    padding: .75rem 1rem;
    border-radius: 8px;
}

/* Desktop */
.hero {
    height: 100vh;
    background-image: url("hero.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* Mobile */
@media (max-width: 768px) {
    .hero {
        background-image: url("mobile-hero.webp");
    }
}
@media (min-width: 700px) and (max-height: 400px) {
.hero-content {
padding: 1rem;
}
}
</style>
</head>

<body>

<div class="hero"></div>

<div class="info">
Testing Hero Image
</div>

</body>
</html>
