<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modal Accessibility Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            max-width: 900px;
            margin: 0 auto;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            width: 450px;
            max-width: 90%;
            padding: 20px;
            border-radius: 10px;
            position: relative;
        }

        .close {
            all: unset;
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            text-align: center;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }

        .close:hover {
            background: #eee;
        }

        .close:focus,
        button:focus,
        select:focus {
            outline: 3px solid royalblue;
            outline-offset: 2px;
        }

        .hidden {
            display: none;
        }

        .shape-container {
            margin-top: 20px;
        }

        .shape-btn {
            width: 50px;
            height: 50px;
            margin: 5px;
        }

        .square {
            background: red;
        }

        .circle {
            background: green;
            border-radius: 50%;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 50px solid blue;
            background: none;
        }

        .diamond {
            background: purple;
            transform: rotate(45deg);
        }

        .focus-start,
        .focus-end {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>



</head>

<body>

    <!--<img  class="icon-lg themeIcon" src="paint-3d.png">-->
    <div class="button-row">
        <button data-open="modal-one">1</button>
        <button data-open="modal-two">2</button>
        <button data-open="modal-three">3</button>
        <button data-open="modal-four">4</button>
    </div>

    <!-- MODAL 1 -->

    <div class="modal-overlay" id="modal-one">
        <div class="modal" role="dialog" aria-modal="true" tabindex="-1">
            <button class="close">&times;</button>

            <h2>Example Form</h2>

            <button id="open-confirm-1">
                Submit
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="confirm-one">
        <div class="modal" role="dialog" aria-modal="true" tabindex="-1">
            <button class="close">&times;</button>

            <h3>Confirm Submit?</h3>

            <button class="modal-close-all">
                Confirm
            </button>
        </div>
    </div>

    <!-- MODAL 2 -->

    <div class="modal-overlay" id="modal-two">
        <div class="modal" role="dialog" aria-modal="true" tabindex="-1">

            <button class="close">&times;</button>

            <h2>Select Colour</h2>

            <select id="colourSelect" class="clearMe">
                <option value="">Choose</option>
                <option>Red</option>
                <option>Blue</option>
                <option>Green</option>
                <option>Yellow</option>
                <option>Purple</option>
            </select>

            <div class="shape-container hidden hideMe">

                <button class="shape-btn square" data-shape="Square"></button>

                <button class="shape-btn circle" data-shape="Circle"></button>

                <button class="shape-btn triangle" data-shape="Triangle"></button>

                <button class="shape-btn diamond" data-shape="Diamond"></button>

            </div>
            <button class="focus-end" aria-hidden="true"></button>
        </div>
    </div>

    <div class="modal-overlay" id="result-modal">
        <div class="modal" role="dialog" aria-modal="true" tabindex="-1">
            <button class="close">&times;</button>

            <h3>Selection</h3>

            <p id="selectionText"></p>
        </div>
    </div>

    <!-- MODAL 3 -->

    <div class="modal-overlay" id="modal-three">
        <div class="modal" role="dialog" aria-modal="true" tabindex="-1">
            <button class="close">&times;</button>

            <h2>Delete Item?</h2>

            <button id="ask-delete">
                Continue
            </button>
        </div>
    </div>


    <!-- MODAL 4 -->

    <div class="modal-overlay" id="modal-four">
        <div class="modal" role="dialog" aria-modal="true" tabindex="-1">

            <button class="close">&times;</button>

            <h2>Input Testing Modal</h2>

            <!-- Text Input -->
            <label for="name">Name</label>
            <input type="text" id="name" class="clearMe" placeholder="Enter your name">

            <!-- Textarea -->
            <label for="notes">Notes</label>
            <textarea id="notes" class="clearMe" rows="4" placeholder="Enter notes"></textarea>

            <!-- Dropdown -->
            <label for="colour">Favourite Colour</label>
            <select id="colour" class="clearMe dropdown">
                <option value="">Choose a colour</option>
                <option value="red">Red</option>
                <option value="blue">Blue</option>
                <option value="green">Green</option>
            </select>

            <!-- Checkbox -->
            <label>
                <input type="checkbox" class="clearMe checkbox">
                Subscribe to newsletter
            </label>

            <label>
                <input type="checkbox" class="clearMe checkbox">
                Just say hi
            </label>

            <!-- Radio Buttons -->
            <fieldset>
                <legend>Membership</legend>

                <label>
                    <input type="radio" name="membership" value="basic" class="clearMe radio">
                    Basic
                </label>

                <label>
                    <input type="radio" name="membership" value="premium" class="clearMe radio">
                    Premium
                </label>
            </fieldset>

            <button>Submit</button>

        </div>
    </div>

    <div class="modal-overlay" id="delete-confirm">
        <div class="modal" role="dialog" aria-modal="true" tabindex="-1">
            <button class="close">&times;</button>

            <h3>Are you sure?</h3>

            <button id="confirm-yes">Yes</button>
            <button id="confirm-no">No</button>

        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>





        let modalStack = [];
        let lastTrigger = null;

        function hideMe(modal) {

            modal.find(".hideMe").each(function () {

                //$(this).attr("hidden", true);
                $(this).addClass('hidden');

            });

        }


        function trapFocus(modal) {

            const focusable = modal.find(
                'button:not(:disabled), select, input, textarea, a[href], [tabindex="0"]'
            );

            console.log("Focusable count:", focusable.length);

            const first = focusable.first();
            const last = focusable.last();

            console.log("First:", first[0]);

            first.focus();

            modal.off('keydown.focusTrap');

            modal.on('keydown.focusTrap', function (e) {

                console.log(
                    "Focused:",
                    document.activeElement
                );

                if (e.key !== 'Tab') return;

                if (e.shiftKey) {

                    if (document.activeElement === first[0]) {
                        e.preventDefault();
                        last.focus();
                    }

                } else {

                    if (document.activeElement === last[0]) {
                        e.preventDefault();
                        first.focus();
                    }

                }

            });

        }

        function clearDropdowns(modal) {

            modal.find('.dropdown-reset').each(function () {

                this.selectedIndex = 0;

                // $(this).trigger('change');

            });

        }

        function clearMe(modal) {

            modal.find(".clearMe").each(function () {

                const element = $(this);

                if (element.is(":checkbox") || element.is(":radio")) {
                    element.prop("checked", false);
                }
                else if (element.is("select")) {
                    element.prop("selectedIndex", 0);
                }
                else {
                    element.val("");
                }

            });

        }


        function openModal(id, trigger) {



            console.log("open modal")



            const modal = $('#' + id);

            if (modal.find(".clearMe").length) {
                clearMe(modal);
            }

            if (modal.find(".hideMe").length) {
                hideMe(modal);
            }



            const focusable = modal.find(
                'button:not(:disabled), select, input, textarea, a[href]'
            );

            if (trigger) {
                lastTrigger = trigger;
            }

            modal.addClass('active');

            modal.addClass('active');

            setTimeout(() => {

                modal.find('.close').first().focus();

            }, 50);

            modalStack.push(modal);

            trapFocus(modal);

        }

        function closeModal() {

            if (modalStack.length === 0) return;

            const modal = modalStack.pop();

            modal.removeClass('active');

            if (modalStack.length) {

                trapFocus(
                    modalStack[modalStack.length - 1]
                );

            } else if (lastTrigger) {

                $(lastTrigger).focus();

            }

        }

        function closeAll() {

            $('.modal-overlay')
                .removeClass('active');

            modalStack = [];

            if (lastTrigger) {
                $(lastTrigger).focus();
            }

        }

        $(function () {

            $('[data-open]').on('click', function () {

                openModal(
                    $(this).data('open'),
                    this
                );

            });

            $('.close').on('click', closeModal);

            $(document).on('keydown', function (e) {

                if (e.key === 'Escape') {

                    e.preventDefault();

                    closeModal();
                }

            });

            $('#open-confirm-1').on('click', function () {
                openModal('confirm-one');
            });

            $('.modal-close-all').on('click', closeAll);

            $('#colourSelect').on('change', function () {

                $('.shape-container')
                    .removeClass('hidden');

            });

            $('.shape-btn').on('click', function () {

                const colour =
                    $('#colourSelect').val();

                const shape =
                    $(this).data('shape');

                $('#selectionText').text(
                    colour + ' - ' + shape
                );

                closeModal();

                openModal('result-modal');
            });

            $('#ask-delete').on('click', function () {
                openModal('delete-confirm');
            });

            $('#confirm-yes').on('click', function () {
                closeAll();
            });

            $('#confirm-no').on('click', function () {
                closeModal();
            });

        });

    </script>

</body>

</html>
